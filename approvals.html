<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garcar — Revenue Approvals</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#f5f5f7;background:#09090b}body{margin:0;background:linear-gradient(145deg,#09090b,#14111a);min-height:100vh}.wrap{max-width:980px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.brand{font-size:22px;font-weight:800}.muted{color:#a1a1aa}.panel{background:#15151a;border:1px solid #2a2a33;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,.18)}label{display:block;font-size:12px;color:#a1a1aa;margin:12px 0 6px}input,select,button,textarea{width:100%;box-sizing:border-box;border-radius:10px;border:1px solid #34343d;background:#0f0f14;color:#fff;padding:11px}button{cursor:pointer;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.row{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}.actions{display:flex;gap:10px}.actions button{width:auto;flex:1}.approve{border-color:#315d43;background:#16301f}.reject{border-color:#63353a;background:#351719}.card{padding:15px;border:1px solid #2a2a33;border-radius:14px;margin-top:12px}.amount{font-size:24px;font-weight:800}.status{display:inline-block;padding:4px 8px;border-radius:99px;background:#22222a;color:#ddd;font-size:11px}.hidden{display:none}.error{color:#ff8f96}.ok{color:#7ee2a8}.spinner{opacity:.7}.small{font-size:12px}.workflow{margin-top:14px;padding:12px;border-radius:12px;background:#101015;border:1px solid #252530}.workflow strong{font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="brand">GARCAR Revenue Control Plane</div><div class="muted">Owner approvals • Stripe-gated execution • Auditable workflow state</div></div><button id="logout" class="hidden" style="width:auto">Sign out</button></div>
  <section id="loginPanel" class="panel">
    <h2>Owner sign in</h2><div class="muted small">Use the Supabase Auth account attached to your Garcar tenant.</div>
    <label>Email</label><input id="email" type="email" autocomplete="email">
    <label>Password</label><input id="password" type="password" autocomplete="current-password">
    <div class="actions" style="margin-top:14px"><button id="login">Sign in</button><button id="signup">Create account</button></div>
    <div id="loginMsg" class="small" style="margin-top:10px"></div>
  </section>
  <section id="appPanel" class="hidden">
    <div class="panel">
      <div class="row">
        <div><label>Authorized tenant</label><select id="tenant"><option value="">Loading tenants…</option></select></div>
        <div><label>Revenue API</label><input id="apiBase" placeholder="https://your-revenue-api.example.com"></div>
      </div>
      <button id="refresh" style="margin-top:12px">Refresh pending approvals</button>
      <div id="msg" class="small" style="margin-top:10px"></div>
    </div>
    <div class="panel"><h2 style="margin-top:0">Pending approvals</h2><div id="list"><div class="muted">No data loaded.</div></div></div>
  </section>
</div>
<script>
const SB_URL='https://obxeatprctjwqbvlrhfx.supabase.co';
const SB_KEY='sb_publishable_4WoLRtLIi7REjnBJ00aubw_q3nV8-zD';
const supabase=window.supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
$('apiBase').value=localStorage.getItem('garcar_api_base')||window.location.origin;
function setMsg(text,cls=''){ $('msg').className='small '+cls; $('msg').textContent=text }
function setLoginMsg(text,cls=''){ $('loginMsg').className='small '+cls; $('loginMsg').textContent=text }
async function api(path,opts={}){
  const {data:{session}}=await supabase.auth.getSession();
  if(!session) throw new Error('Session expired. Sign in again.');
  const base=($('apiBase').value||window.location.origin).replace(/\/$/,'');
  localStorage.setItem('garcar_api_base',base);
  const r=await fetch(base+path,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,...(opts.headers||{})}});
  const body=await r.json().catch(()=>({})); if(!r.ok) throw new Error(body.detail||'Request failed ('+r.status+')'); return body;
}
function money(cents,c='usd'){return new Intl.NumberFormat('en-US',{style:'currency',currency:c.toUpperCase()}).format((cents||0)/100)}
function card(item){const w=item.workflow,q=item.quote,s=w.state||{}; return `<div class="card"><div style="display:flex;justify-content:space-between;gap:12px"><div><div class="amount">${money(q.amount_cents,q.currency)}</div><div style="margin-top:5px"><strong>${escapeHtml(s.company||'Unknown company')}</strong></div><div class="muted small">${escapeHtml(s.customer_email||'')}</div><div class="muted small">Lead ${escapeHtml(w.lead_id)} • <span class="status">${escapeHtml(w.status)}</span></div></div><div style="text-align:right"><div class="muted small">Updated</div><div class="small">${new Date(w.updated_at).toLocaleString()}</div></div></div><label>Reason</label><div class="small">Approve this quote before any payment request is released.</div><label>Comment</label><textarea id="comment-${w.id}" rows="2" placeholder="Optional approval note"></textarea><div class="actions" style="margin-top:10px"><button class="approve" onclick="decide('${w.id}','approved')">Approve quote</button><button class="reject" onclick="decide('${w.id}','rejected')">Reject</button></div><div class="workflow"><strong>Workflow:</strong> approval → Stripe Checkout → payment event → onboarding</div></div>`}
function escapeHtml(v){return String(v).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
async function loadTenants(){setMsg('Loading authorized tenants…','spinner'); try{const b=await api('/api/revenue/tenants'); const saved=localStorage.getItem('garcar_tenant_id')||''; const items=b.items||[]; if(!items.length){$('tenant').innerHTML='<option value="">No active tenants</option>';return} $('tenant').innerHTML=items.map(x=>{const t=x.crf_tenants||{}; return `<option value="${escapeHtml(x.tenant_id)}">${escapeHtml(t.name||t.slug||x.tenant_id)} — ${escapeHtml(x.role||'member')}</option>`}).join(''); const chosen=items.some(x=>x.tenant_id===saved)?saved:items[0].tenant_id; $('tenant').value=chosen; localStorage.setItem('garcar_tenant_id',chosen); setMsg(`${items.length} authorized tenant(s) available.`,'ok'); await load()}catch(e){setMsg(e.message,'error')}}
async function load(){const tenant=$('tenant').value.trim(); if(!tenant)return setMsg('No authorized tenant selected.','error'); localStorage.setItem('garcar_tenant_id',tenant); setMsg('Loading…','spinner'); try{const b=await api('/api/revenue/approvals?tenant_id='+encodeURIComponent(tenant)); $('list').innerHTML=b.items?.length?b.items.map(card).join(''):'<div class="muted">No pending approvals.</div>'; setMsg(`${b.count||0} approval(s) pending.`,'ok')}catch(e){setMsg(e.message,'error')}}
async function decide(id,decision){const comment=$('comment-'+id)?.value||''; setMsg(decision==='approved'?'Approving…':'Rejecting…','spinner'); try{await api('/api/revenue/approvals/'+id,{method:'POST',body:JSON.stringify({decision,comment})}); await load()}catch(e){setMsg(e.message,'error')}}
$('login').onclick=async()=>{setLoginMsg('');try{const {error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;showApp()}catch(e){setLoginMsg(e.message,'error')}};
$('signup').onclick=async()=>{setLoginMsg('');try{const {error}=await supabase.auth.signUp({email:$('email').value.trim(),password:$('password').value});if(error)throw error;setLoginMsg('Account created. Check email confirmation if required.','ok')}catch(e){setLoginMsg(e.message,'error')}};
$('refresh').onclick=load;$('tenant').onchange=load;$('logout').onclick=async()=>{await supabase.auth.signOut();showLogin()};
function showApp(){ $('loginPanel').classList.add('hidden');$('appPanel').classList.remove('hidden');$('logout').classList.remove('hidden');loadTenants() }
function showLogin(){ $('appPanel').classList.add('hidden');$('loginPanel').classList.remove('hidden');$('logout').classList.add('hidden') }
supabase.auth.onAuthStateChange((_e,s)=>s?showApp():showLogin());
(async()=>{const {data:{session}}=await supabase.auth.getSession();session?showApp():showLogin()})();
setInterval(()=>{if(!$('appPanel').classList.contains('hidden'))load()},15000);
</script>
</body>
</html>
