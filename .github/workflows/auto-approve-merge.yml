name: Auto Approve & Merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: ["*"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-approve-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.name != github.workflow)
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Resolve pull request
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            number="$EVENT_PR_NUMBER"
          else
            number="$(gh pr list --head "$HEAD_BRANCH" --state open \
              --json number --jq '.[0].number // empty')"
          fi

          if [ -z "$number" ]; then
            echo "No open pull request for this event; nothing to approve or merge."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          state="$(gh pr view "$number" --json isDraft,isCrossRepository \
            --jq '"\(.isDraft) \(.isCrossRepository)"')"
          read -r is_draft is_fork <<< "$state"

          if [ "$is_draft" = "true" ]; then
            echo "Pull request #$number is a draft; skipping."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$is_fork" = "true" ]; then
            echo "Pull request #$number comes from a fork; skipping automatic approval and merge."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Pull request #$number is ready for auto approve and merge."
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Approve pull request
        if: steps.pr.outputs.number != ''
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail

          if gh pr review "$PR_NUMBER" --approve --body "Automatically approved."; then
            echo "Approved pull request #$PR_NUMBER."
          else
            echo "::warning::Could not approve pull request #$PR_NUMBER. It may already be approved, or GitHub Actions approvals may be disabled for this repository."
          fi

      - name: Squash merge pull request
        if: steps.pr.outputs.number != ''
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail

          if gh pr merge "$PR_NUMBER" --squash --delete-branch --auto; then
            echo "Merged (or queued for auto merge) pull request #$PR_NUMBER."
          else
            echo "Auto merge unavailable; attempting an immediate squash merge."
            gh pr merge "$PR_NUMBER" --squash --delete-branch
          fi
