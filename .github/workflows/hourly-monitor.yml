name: RHNS Hourly Monitor
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests pydantic
      - env:
          RAILWAY_PUBLIC_DOMAIN: ${{ secrets.RAILWAY_PUBLIC_DOMAIN }}
          NEXUS_WEBHOOK_URL: ${{ secrets.NEXUS_WEBHOOK_URL }}
        run: python monitor.py
